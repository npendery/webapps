<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="findbar.css" />
  </head>
  <body>
    <div class="bar">
      <input id="query" type="text" placeholder="Find in page" spellcheck="false" autocomplete="off" />
      <span id="count" class="count"></span>
      <button id="prev" title="Previous (⇧⌘G)">‹</button>
      <button id="next" title="Next (⌘G)">›</button>
      <button id="close" title="Close (Esc)">×</button>
    </div>
    <script src="findbar.js"></script>
  </body>
</html>
